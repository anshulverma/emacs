name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  # Catch upstream breakage even without commits.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

# Cancel superseded runs: a new push to a branch/PR stops the previous
# in-progress run instead of letting both burn the full matrix.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  load-init:
    name: Load init on Emacs ${{ matrix.emacs-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # Floor is 29.1. Two packages hard-require it — elfeed and
        # idle-highlight-mode both declare (emacs "29.1") and are gated on
        # the running version in src/av-packages.el. Emacs 28.2 was dropped
        # on 2026-10-15: its built-in Org is 9.5, whose `org-macs' predates
        # `org-assert-version' (Org 9.6+), so ELPA org 9.8.3 cannot
        # byte-compile its own files there without evicting the built-in org
        # from `load-path' first. 29.4 / 30.2 / snapshot all pass.
        emacs-version: ['29.4', '30.2', 'snapshot']
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false

      - uses: purcell/setup-emacs@v8.0
        with:
          version: ${{ matrix.emacs-version }}

      - name: System deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y aspell pandoc

      - name: Load init.el (installs ELPA packages)
        run: |
          emacs -Q --batch \
            -l init.el \
            --eval '(message "INIT OK on Emacs %s" emacs-version)' \
            --kill
